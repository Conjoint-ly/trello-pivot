<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-3.5.1.min.js" integrity="sha256-9/aliU8dGd2tb6OSsuzixeV4y/faTqgFtohetphbbj0=" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js" integrity="sha256-VazP97ZCwtekAsvgPBSUwPFKdrwD3unUfSGVYrahUqU=" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.css">
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.12.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://p.trellocdn.com/power-up.css">
    <style>
        #dateFilterContainer {
            padding: 10px;
            background-color: #f5f5f5;
            border-radius: 5px;
            margin-bottom: 10px;
            display: none;
        }
        #dateFilterContainer.active {
            display: block;
        }
        .date-filter-field {
            margin: 5px 0;
        }
        .date-filter-field label {
            display: inline-block;
            width: 100px;
            font-weight: bold;
        }
        .date-filter-field input {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 3px;
        }
        .date-filter-buttons {
            margin-top: 10px;
        }
        .date-filter-buttons button {
            padding: 5px 15px;
            margin-right: 5px;
            cursor: pointer;
            background-color: #0079bf;
            color: white;
            border: none;
            border-radius: 3px;
        }
        .date-filter-buttons button:hover {
            background-color: #026aa7;
        }
        .date-filter-buttons button.clear {
            background-color: #eb5a46;
        }
        .date-filter-buttons button.clear:hover {
            background-color: #cf513d;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pivottable/2.23.0/pivot.min.js" integrity="sha256-/btBGbvOvx2h/NcXVS+JPFhnoUGbZXDX0O2v6AaABLU=" crossorigin="anonymous"></script>
    <script src="https://p.trellocdn.com/power-up.min.js" crossorigin="anonymous"></script>
    <script src="../js/modal.js"></script>
</head>
<body>    
    <div id="xxxx" style="padding: 10px;color: red;padding-bottom: 20px; display: flex;flex-flow: inherit;">
      <span style="float: left;">
          <b>⚠️ Attention:</b> Something wrong is happening with Trello. Please read <a href="https://community.atlassian.com/t5/Trello-discussions/Would-love-to-have-markdown-editing/td-p/2603253" target="_blank">this complaint</a>, <a href="https://community.atlassian.com/t5/Trello-questions/Please-stop-making-unnecessary-changes-to-Trello/qaq-p/2688914#M92965" target="_blank">this complaint</a>, and <a href="https://www.reddit.com/r/trello/comments/1m83itk/open_letter_to_trello_leadership/" target="_blank">this complaint</a>. We are starting to look for alternatives to Trello. We do not promise to maintain this Pivot Table plugin in the future.
      </span> 
    </div>
    <div id="dateFilterContainer">
        <h4>Date Range Filter</h4>
        <div class="date-filter-field">
            <label for="dateFilterField">Date Field:</label>
            <select id="dateFilterField">
                <option value="">Select a date field...</option>
            </select>
        </div>
        <div class="date-filter-field">
            <label for="dateFrom">From:</label>
            <input type="text" id="dateFrom" placeholder="YYYY-MM-DD" />
        </div>
        <div class="date-filter-field">
            <label for="dateTo">To:</label>
            <input type="text" id="dateTo" placeholder="YYYY-MM-DD" />
        </div>
        <div class="date-filter-buttons">
            <button id="applyDateFilter">Apply Filter</button>
            <button id="clearDateFilter" class="clear">Clear Filter</button>
            <button id="toggleDateFilter" class="clear">Hide</button>
        </div>
    </div>
    <div id="output"></div>
</body>
</html>
